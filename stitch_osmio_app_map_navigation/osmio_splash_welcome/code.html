<style>
        body {
            background-color: #0F0F0F;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #e5e2e1;
        }

        .tactical-grid {
            background-image: 
                linear-gradient(to right, #1A1A1A 1px, transparent 1px),
                linear-gradient(to bottom, #1A1A1A 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .neon-glow {
            filter: drop-shadow(0 0 10px rgba(223, 255, 0, 0.4));
        }

        .btn-active:active {
            transform: scale(0.98);
            filter: brightness(0.9);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(223, 255, 0, 0.03), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        .flicker {
            animation: flicker 4s linear infinite;
        }

        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.8; }
        }
    </style>
</head>
<body class="font-body-lg text-body-lg">
<!-- Global Background Elements -->
<div class="fixed inset-0 tactical-grid opacity-40 z-0"></div>
<div class="scanline z-10"></div>
<!-- Atmospheric Ambient Effect -->

<main class="relative z-20 w-full max-w-[1440px] px-container-margin h-full flex flex-col items-center justify-between py-xl lg:py-40">
<!-- Identity Header (Desktop Style) -->
<div class="hidden lg:flex w-full justify-between items-start">
<div class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-primary-fixed tracking-widest uppercase">Combat OS v2.4</span>
<span class="font-data-display text-data-display text-primary opacity-40">SYSTEM: ONLINE</span>
</div>
<div class="text-right flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Biometric Link</span>

</div>
</div>
<!-- Central Branding Container -->
<div class="flex flex-col items-center text-center max-w-2xl">
<!-- Logo Section -->

<div class="absolute -inset-4 bg-primary-fixed/10 blur-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-1000"></div>

</div>
<!-- Tagline Section -->
<div class="space-y-4">
<h1 class="font-headline-lg-mobile lg:font-headline-lg text-headline-lg-mobile lg:text-headline-lg text-primary tracking-tight">
                    OSMIO
                </h1>
<p class="font-body-lg text-on-surface-variant max-w-md mx-auto leading-relaxed border-l-2 border-primary-fixed pl-4 text-left italic opacity-80">
                    "El cuaderno de un peleador, con esteroides tecnológicos"
                </p>
</div>
</div>
<!-- Call to Action Section -->
<div class="w-full max-w-xs flex flex-col gap-4">
<!-- Primary CTA -->
<button class="w-full bg-primary-fixed text-on-primary font-label-caps text-label-caps py-4 rounded-none flex items-center justify-center gap-2 tracking-[0.2em] transition-all hover:bg-white hover:text-black btn-active border border-primary-fixed">
                EMPEZAR
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Secondary CTA -->
<button class="w-full bg-transparent text-primary-fixed font-label-caps text-label-caps py-4 rounded-none flex items-center justify-center gap-2 tracking-[0.2em] border border-primary-fixed/30 hover:border-primary-fixed hover:bg-primary-fixed/5 transition-all btn-active">
                YA TENGO CUENTA
            </button>
<!-- Metadata Footer (Mobile/Splash specific) -->
<div class="mt-8 flex flex-col items-center gap-2 opacity-30">
<div class="w-12 h-px bg-on-surface-variant"></div>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">Tactical Minimalism UI</span>
</div>

</main>

<div class="fixed top-8 left-8 hidden lg:block z-30">
<div class="w-8 h-8 border-t border-l border-primary-fixed/40"></div>
</div>

<div class="w-8 h-8 border-t border-r border-primary-fixed/40"></div>
</div>
<div class="fixed bottom-8 left-8 hidden lg:block z-30">
<div class="w-8 h-8 border-b border-l border-primary-fixed/40"></div>
</div>
<div class="fixed bottom-8 right-8 hidden lg:block z-30">
<div class="w-8 h-8 border-b border-r border-primary-fixed/40"></div>
</div>
<!-- Micro-interaction Scripts -->
<script>
        // Simple hover audio cue simulation or subtle movement can be added here
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                // Future: Add mechanical click SFX
            });
        });

        // Interactive mouse parallax for background grid
        document.addEventListener('mousemove', (e) => {
            const grid = document.querySelector('.tactical-grid');
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            grid.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
